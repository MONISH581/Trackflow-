services:
  - type: web
    name: trackflow
    env: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

  - type: cron
    name: trackflow-keepalive-cron
    env: node
    schedule: "*/5 * * * *"
    buildCommand: echo "Keep-alive cron initialized"
    startCommand: curl -s https://trackflow.onrender.com/api/health || true
